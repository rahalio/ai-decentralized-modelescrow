openapi: 3.0.3
info:
  title: Modelescrow
  version: 0.1.0
  description: >-
    Trustless ML model bounty desk with escrowed rewards, independent evaluation,
    and settlement for winning submissions.
  x-product-slug: ai-decentralized-modelescrow
  x-source: ai-in-decentralized+ai/Algorythmia-Blog-Archives/
servers:
  - url: https://api.example.com
tags:
  - name: Contests
  - name: Submissions
  - name: Evaluations
  - name: Escrows
  - name: Settlements
paths:
  /v1/contests:
    get:
      operationId: listContests
      tags: [Contests]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, funded, open, evaluating, settled, cancelled]
      responses:
        "200":
          description: Contests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeContest"
    post:
      operationId: createContest
      tags: [Contests]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestCreate"
      responses:
        "201":
          description: Contest created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContest"
  /v1/contests/{contestId}:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getContest
      tags: [Contests]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: Contest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/contests/{contestId}/submissions:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listSubmissions
      tags: [Submissions]
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Submissions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSubmission"
    post:
      operationId: submitModel
      tags: [Submissions]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionCreate"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSubmission"
  /v1/submissions/{submissionId}/evaluations:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: runEvaluation
      tags: [Evaluations]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "202":
          description: Evaluation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEvaluationRun"
  /v1/contests/{contestId}/leaderboard:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getLeaderboard
      tags: [Evaluations]
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeLeaderboard"
  /v1/contests/{contestId}/escrow:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: lockEscrow
      tags: [Escrows]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscrowLock"
      responses:
        "201":
          description: Escrow locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscrow"
    get:
      operationId: getEscrow
      tags: [Escrows]
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Escrow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEscrow"
  /v1/contests/{contestId}/settlement:
    parameters:
      - name: contestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: settleContest
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRequest"
      responses:
        "202":
          description: Settlement accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSettlement"
  /v1/disputes:
    post:
      operationId: openEvaluationDispute
      tags: [Settlements]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeCreate"
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDispute"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

    Contest:
      type: object
      required: [id, title, status, datasetHash, metricName]
      properties:
        id: { type: string }
        title: { type: string }
        status:
          type: string
          enum: [draft, funded, open, evaluating, settled, cancelled]
        datasetHash: { type: string }
        evaluationFunction: { type: string }
        metricName: { type: string }
        sealedEvaluation: { type: boolean }
        rewardAmount: { type: number, format: double }
        rewardCurrency: { type: string }
        takeRate: { type: number, format: float }
        deadline: { type: string, format: date-time }
    ContestCreate:
      type: object
      required: [title, datasetHash, evaluationFunction, metricName, rewardAmount, deadline]
      properties:
        title: { type: string }
        datasetHash: { type: string }
        evaluationFunction: { type: string }
        metricName: { type: string }
        sealedEvaluation: { type: boolean }
        rewardAmount: { type: number, format: double }
        rewardCurrency: { type: string }
        takeRate: { type: number, format: float }
        deadline: { type: string, format: date-time }
        requireHumanDeployGate: { type: boolean }
    Submission:
      type: object
      required: [id, contestId, providerId, artefactUri, status]
      properties:
        id: { type: string }
        contestId: { type: string }
        providerId: { type: string }
        artefactUri: { type: string }
        artefactHash: { type: string }
        status:
          type: string
          enum: [received, evaluating, scored, invalid, withdrawn]
    SubmissionCreate:
      type: object
      required: [artefactUri, artefactHash]
      properties:
        artefactUri: { type: string }
        artefactHash: { type: string }
    EvaluationRun:
      type: object
      required: [id, submissionId, status]
      properties:
        id: { type: string }
        submissionId: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
        score: { type: number, format: float }
        logHash: { type: string }
    Leaderboard:
      type: object
      required: [contestId, entries]
      properties:
        contestId: { type: string }
        entries:
          type: array
          items:
            type: object
            properties:
              submissionId: { type: string }
              providerId: { type: string }
              score: { type: number, format: float }
              rank: { type: integer }
    Escrow:
      type: object
      required: [id, contestId, status, amount]
      properties:
        id: { type: string }
        contestId: { type: string }
        status:
          type: string
          enum: [locked, released, returned]
        amount: { type: number, format: double }
        currency: { type: string }
        railReference: { type: string }
    EscrowLock:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double }
        currency: { type: string }
        railReference: { type: string }
    Settlement:
      type: object
      required: [id, contestId, status]
      properties:
        id: { type: string }
        contestId: { type: string }
        status:
          type: string
          enum: [pending, paid, returned, blocked_compliance]
        winnerSubmissionId: { type: string }
        payoutReference: { type: string }
    SettlementRequest:
      type: object
      required: [winnerSubmissionId]
      properties:
        winnerSubmissionId: { type: string }
        complianceCleared: { type: boolean }
    Dispute:
      type: object
      required: [id, contestId, submissionId, status]
      properties:
        id: { type: string }
        contestId: { type: string }
        submissionId: { type: string }
        status:
          type: string
          enum: [open, resolved, rejected]
        claim: { type: string }
    DisputeCreate:
      type: object
      required: [contestId, submissionId, claim]
      properties:
        contestId: { type: string }
        submissionId: { type: string }
        claim: { type: string }
        evidenceUri: { type: string }

    DataEnvelopeContest:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Contest"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeContest:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Contest"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeSubmission:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Submission"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSubmission:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Submission"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeEvaluationRun:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/EvaluationRun"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeEvaluationRun:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/EvaluationRun"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeLeaderboard:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Leaderboard"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeLeaderboard:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Leaderboard"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeEscrow:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Escrow"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeEscrow:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Escrow"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeSettlement:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Settlement"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeSettlement:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Settlement"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    DataEnvelopeDispute:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Dispute"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
    ListEnvelopeDispute:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Dispute"
            nextCursor:
              type: string
        meta:
          $ref: "#/components/schemas/ResponseMeta"
