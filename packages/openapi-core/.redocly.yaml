apis:
  identity:
    root: src/identity.yaml
  contests:
    root: src/contests.yaml
  submissions:
    root: src/submissions.yaml
  evaluations:
    root: src/evaluations.yaml
  escrows:
    root: src/escrows.yaml
  settlements:
    root: src/settlements.yaml
  disputes:
    root: src/disputes.yaml
  deploygates:
    root: src/deploygates.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
